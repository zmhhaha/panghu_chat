# 把 Obsidian 的一个 corpus 索引进 rag-service。
#
# **一个 corpus 一个作业。** corpus 是 `<服务组>/<人格名>`，而 collection 由作业持有
# 的身份决定（rag-service 的 `auth.py`），所以两个 corpus 不可能共用一个作业。各自的
# 意愿（挂哪个目录、用哪个身份）都写在它自己这一段里 —— 这就是设计里「意愿留在消费方
# 自己的清单里」的落点。
#
# **挂载收窄到 corpus。** `subPath` 挂进容器，`mountPath` 用同一个 corpus 路径：
# 作业看到的 `/vault` 下**只有它自己那个 corpus 目录**，`private/`、vault 根下笔记、
# 别人的人格都不在它的文件系统里。于是「默认不外发」是**结构性**的，不再依赖脚本里的
# 前缀判断。source_id 仍是 vault 相对路径（脚本以 `VAULT_PATH=/vault` 为基准取
# `relpath`），所以收窄**不改变任何文档 id**，不需要重索引。
# ⚠️ 因此 `mountPath` 与 `--corpus` 必须指同一个目录 —— 对不上时脚本会因为
# 「corpus 目录不存在」大声失败（`index.py`，不会静默什么都不做）。
#
# 需要单跑一次排查时：
#
#   kubectl -n obsidian create job --from=cronjob/obsidian-indexer-bingbichunqiu idx-once
#   kubectl -n obsidian logs job/idx-once
#
# 脚本本身不在镜像里，由 deploy.sh 从 indexer/index.py 生成 ConfigMap
# obsidian-indexer —— 单一来源，避免清单与源码两份分叉。所以本文件要在
# ConfigMap 之后应用。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: obsidian-indexer-bingbichunqiu
  namespace: obsidian
spec:
  # 每小时一次。笔记不是秒级需求，而且索引作业对没变的内容只花一次列表查询
  # （内容没变就不上传、不重新 embedding），所以这个频率下成本可以忽略。
  #
  # 用 :23 而不是 :00 —— 整点是所有人都会挑的时刻，错开能少和别人抢。两个 corpus
  # 的作业也彼此错开（另见 :41 那段），免得两批 embedding 撞在同一分钟。
  schedule: "23 * * * *"
  suspend: false
  # Forbid 是必需的：两次并发跑会对同一批文档做上传与删除，产生交错。
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: obsidian-indexer
            # rag-service 的 NetworkPolicy 只接受带这个标签的 Pod 作 ingress：
            #   ingress.from = podSelector matchLabels {rag-client: "true"}
            # 少了它，连接会一直 timeout（2026-09-26 实测）。同命名空间里没打标签
            # 的 Pod 一样连不上 —— 策略是按 pod 选的，不是按 namespace。
            #
            # 集群 2026-09-21 从 flannel 换成 Calico 之后策略才真正生效；
            # 在那之前「调用方要打 rag-client 标签」这条在集群里是没有约束力的。
            rag-client: "true"
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: index
              # 纯标准库，所以任何 python 镜像都能跑；用私仓里已有的那个，
              # 不需要为这个作业单开一条构建链。
              image: arm-cluster-master:5000/python3_base:latest
              imagePullPolicy: Always
              command:
                - python3
                - /indexer/index.py
                - --corpus
                - 百家争鸣/秉笔春秋
              env:
                - name: RAG_URL
                  value: http://rag-service.data.svc.cluster.local:8080
                # 该消费方自己的身份。collection 由它决定，不在参数里给。
                # 使用者不持有任何 RAG 凭据。
                - name: RAG_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: obsidian-indexer-bingbichunqiu
                      key: RAG_TOKEN
                # 容器里不设 locale 时 stdout 可能是 ASCII，打印中文路径会抛
                # UnicodeEncodeError。脚本内部也重新配置了编码，这里是第二道。
                - name: PYTHONIOENCODING
                  value: UTF-8
              volumeMounts:
                # 收窄到本 corpus：容器里 /vault 下只有这一个目录。
                - name: vault
                  mountPath: /vault/百家争鸣/秉笔春秋
                  subPath: 百家争鸣/秉笔春秋
                  readOnly: true
                - name: script
                  mountPath: /indexer
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
          volumes:
            - name: vault
              persistentVolumeClaim:
                claimName: obsidian-notes
            - name: script
              configMap:
                name: obsidian-indexer
---
# 第二个人格。除下面四处不同（名字 / corpus / 身份 / 错开的分钟）之外，与上段完全一致：
# 身份决定 collection，所以 `RAG_TOKEN_DAOFAZIRAN` 让《道德经》落进 `agent-daofaziran`，
# 而 `bingbichunqiu` 那边永远看不到它。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: obsidian-indexer-daofaziran
  namespace: obsidian
spec:
  schedule: "41 * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: obsidian-indexer
            # 同上：少了 rag-client 标签会被 rag-service 的 NetworkPolicy 拒掉。
            rag-client: "true"
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: index
              image: arm-cluster-master:5000/python3_base:latest
              imagePullPolicy: Always
              command:
                - python3
                - /indexer/index.py
                - --corpus
                - 百家争鸣/道法自然
              env:
                - name: RAG_URL
                  value: http://rag-service.data.svc.cluster.local:8080
                - name: RAG_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: obsidian-indexer-daofaziran
                      key: RAG_TOKEN
                - name: PYTHONIOENCODING
                  value: UTF-8
              volumeMounts:
                - name: vault
                  mountPath: /vault/百家争鸣/道法自然
                  subPath: 百家争鸣/道法自然
                  readOnly: true
                - name: script
                  mountPath: /indexer
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
          volumes:
            - name: vault
              persistentVolumeClaim:
                claimName: obsidian-notes
            - name: script
              configMap:
                name: obsidian-indexer
