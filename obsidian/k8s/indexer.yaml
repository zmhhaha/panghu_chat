# 索引作业的**模板**。一个 corpus 一份，由 deploy.sh 按人格名册逐个人格渲染后应用
# —— **别直接 kubectl apply 本文件**，里面有 __SLUG__ 这类占位符。
#
# 名册是唯一来源（`panghu_agent/baijiazhengming/registry.yaml`）：slug 决定身份、
# display_name 决定 corpus 目录名、勾了 `rag_enabled` 的人格才建作业。于是
# 「新接入一个人格」= 名册加一条 + 跑一次 `bash deploy.sh --indexers`，不需要再手写
# 第二份 YAML。第二个"服务组"同理：deploy.sh 顶部的 SERVICE_GROUPS 加一行。
#
# 挂的是**整个卷（只读）**，不是本 corpus 的子目录 —— 这是取舍，不是疏忽：
#
#   `subPath` 指向一个还不存在的目录时，kubelet 直接挂载失败、Pod 根本起不来。
#   而八个人格从第一天起就各有一个作业，其中大多数 corpus 目录**还不存在**
#   （空目录不参与同步：没有笔记就没有目录）。所以"挂载收窄到 corpus"和
#   "统一为八个人格建作业"二者不可兼得，这里选后者。
#
#   代价：作业进程理论上读得到 `private/` 和别人的 corpus，隔离靠脚本里那条显式的
#   `--corpus`（`index.py` 只遍历它，删除也只删它前缀下的文档）。文件型消费者不受影响
#   —— 它们按设计各挂自己的 `subPath`（见 downstream-distribution.md ③），因为一个
#   消费者要读的语料必然已经存在。
#
#   将来要补上这层结构性隔离，前提是 corpus 目录一定存在（例如物化侧为每个 corpus
#   建目录），那时再给这里加 `subPath`。
#
# `__MINUTE__` 由 deploy.sh 按名册序号错开（(23 + 7i) mod 60），免得八批 embedding
# 撞在同一分钟；别手改 —— 重跑 deploy.sh 会覆盖。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: obsidian-indexer-__SLUG__
  namespace: obsidian
spec:
  # 每小时一次，第 __MINUTE__ 分。笔记不是秒级需求，而且索引作业对没变的内容只花一次
  # 列表查询（内容没变就不上传、不重新 embedding），所以这个频率下成本可以忽略。
  schedule: "__MINUTE__ * * * *"
  suspend: false
  # Forbid 是必需的：两次并发跑会对同一批文档做上传与删除，产生交错。
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: obsidian-indexer
            # rag-service 的 NetworkPolicy 只接受带这个标签的 Pod 作 ingress：
            #   ingress.from = podSelector matchLabels {rag-client: "true"}
            # 少了它，连接会一直 timeout（2026-09-26 实测）。同命名空间里没打标签
            # 的 Pod 一样连不上 —— 策略是按 pod 选的，不是按 namespace。
            #
            # 集群 2026-09-21 从 flannel 换成 Calico 之后策略才真正生效；
            # 在那之前「调用方要打 rag-client 标签」这条在集群里是没有约束力的。
            rag-client: "true"
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: index
              # 纯标准库，所以任何 python 镜像都能跑；用私仓里已有的那个，
              # 不需要为这个作业单开一条构建链。
              image: arm-cluster-master:5000/python3_base:latest
              imagePullPolicy: Always
              command:
                - python3
                - /indexer/index.py
                - --corpus
                # corpus = <服务组>/<人格名>，两段都来自名册
                - "__SERVICE_GROUP__/__DISPLAY_NAME__"
              env:
                - name: RAG_URL
                  value: http://rag-service.data.svc.cluster.local:8080
                # 该人格自己的身份。collection 由它决定，不在参数里给 —— 所以这个
                # 作业只能写进 __SLUG__ 自己的 collection，看不到别人的。
                # 使用者不持有任何 RAG 凭据。
                - name: RAG_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: obsidian-indexer-__SLUG__
                      key: RAG_TOKEN
                # 容器里不设 locale 时 stdout 可能是 ASCII，打印中文路径会抛
                # UnicodeEncodeError。脚本内部也重新配置了编码，这里是第二道。
                - name: PYTHONIOENCODING
                  value: UTF-8
              volumeMounts:
                - name: vault
                  mountPath: /vault
                  readOnly: true
                - name: script
                  mountPath: /indexer
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
          volumes:
            - name: vault
              persistentVolumeClaim:
                claimName: obsidian-notes
            - name: script
              configMap:
                # 脚本不在镜像里，由 deploy.sh 从 indexer/index.py 生成 —— 单一来源，
                # 避免清单与源码两份分叉。所有作业共用这一个 ConfigMap。
                name: obsidian-indexer
