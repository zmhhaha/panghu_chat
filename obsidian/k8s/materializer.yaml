# Materializes the vault out of CouchDB into plain Markdown.
#
# Self-hosted LiveSync keeps notes in CouchDB in the plugin's own chunked
# document format, which no unrelated service can read. Turning that back into
# real .md files is what satisfies the downstream-read requirement; pointing
# consumers at CouchDB would not.
#
# Runs the CLI's `daemon` command, which is its default mode: an initial mirror
# scan followed by continuous CouchDB <-> filesystem synchronisation driven by
# the _changes feed. Chosen over a CronJob running `sync` then `mirror` because
# it is the tool's mainline path (the upstream README's own first example) and
# because it removes the polling delay rather than trading latency against how
# often a schedule is allowed to fire.
#
# This workload is the only writer to obsidian-notes. That is not a preference:
# the synchronisation is bidirectional, so a downstream consumer with write
# access could push its own edits back into CouchDB. Every downstream mount
# must be read-only.
#
# Known gap: there is no liveness probe. The container's only process is the
# daemon, launched with exec, so a dead daemon is a dead container and the
# kubelet already restarts it. A probe would not detect the failure that
# actually matters here -- a daemon that is alive but wedged -- so no probe is
# claimed to cover it. Check `kubectl -n obsidian logs deploy/obsidian-materializer`
# and the restart count when notes stop appearing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-materializer
  namespace: obsidian
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the cache volume is ReadWriteOnce and a
  # second replica would block on it rather than help.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obsidian-materializer
  template:
    metadata:
      labels:
        app: obsidian-materializer
        role: materializer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: materialize
          image: arm-cluster-master:5000/livesync-cli:latest
          imagePullPolicy: Always
          command:
            - /usr/bin/bash
            - -c
          args:
            - |
              set -Eeuo pipefail

              settings=/data/settings.json

              # Do NOT pass the database path. The image's entrypoint wrapper
              # already prepends ${LIVESYNC_DB_PATH:-/data}, so writing it here
              # too produces `<db> <db> ...` and the CLI answers
              # "Unknown command '/data'". Verified on the built image:
              # `livesync-cli /data ... sync` fails that way, while
              # `livesync-cli ... sync` reaches the command.
              # init-settings refuses to overwrite an existing file, so it only
              # runs when there is nothing there yet.
              if [ ! -f "${settings}" ]; then
                echo 'Creating a default settings file.'
                livesync-cli --settings "${settings}" init-settings
              fi

              # `setup` runs on EVERY start, not only on the first.
              #
              # An earlier version guarded it with the same "file exists" test.
              # A run that created settings.json and then failed before applying
              # the URI left an unconfigured file behind, the guard skipped the
              # repair on every later start, and the daemon failed to initialise
              # forever with no hint as to why. Re-applying the URI is cheap and
              # idempotent, and it self-heals exactly that state.
              #
              # `setup` always prompts for a Setup URI passphrase and there is
              # no --passphrase flag -- it reads a line from stdin.
              #
              # The feed MUST end with a newline. The prompt is
              # `readline.question()` over stdin; if stdin reaches EOF without a
              # newline the promise never settles, the event loop drains, and
              # Node exits 0 having done nothing -- no error, no output, and
              # settings left unconfigured. A secret file that does not end in a
              # newline reproduces this exactly.
              #
              # Process substitution rather than a temp file or an environment
              # variable: nothing is written to disk and the value never reaches
              # the process list.
              echo 'Applying the Setup URI.'
              livesync-cli --settings "${settings}" setup \
                "$(cat /secrets/setup-uri)" \
                < <(cat /secrets/setup-uri-passphrase; echo)

              # The Setup URI points at the public hostname and stays that way.
              # The idea of rewriting it to the in-cluster Service was tried and
              # dropped: the connection details are stored encrypted inside
              # settings.json, so there is nothing to rewrite textually, and
              # measurement showed the public route was never the problem --
              # every request the CLI made returned 200/201. The failure was the
              # remote database being locked, not reaching it.

              # --interval puts the daemon in polling mode.
              #
              # Without it the daemon does the initial replication and then
              # stops: it reports "liveSync and syncOnStart are both disabled in
              # settings. No sync will occur." The Setup URI carries the
              # device's settings, where neither is enabled, so the materializer
              # would only ever see the state at its first start.
              #
              # The alternative is to flip liveSync in settings.json, but that
              # file is rewritten by `setup` on every start and its connection
              # block is stored encrypted. A documented CLI flag is the smaller
              # lever.
              echo 'Starting the daemon.'
              exec livesync-cli --settings "${settings}" --vault /vault --interval 60
          volumeMounts:
            - name: cache
              mountPath: /data
            - name: notes
              mountPath: /vault
            - name: secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: obsidian-sync-cache
        - name: notes
          persistentVolumeClaim:
            claimName: obsidian-notes
        - name: secrets
          secret:
            secretName: obsidian-livesync
