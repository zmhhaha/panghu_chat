apiVersion: v1
kind: Service
metadata:
  name: obsidian-couchdb
  namespace: obsidian
spec:
  type: ClusterIP
  selector:
    app: obsidian-couchdb
  ports:
    - name: http
      port: 5984
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: obsidian-couchdb
  namespace: obsidian
spec:
  serviceName: obsidian-couchdb
  replicas: 1
  selector:
    matchLabels:
      app: obsidian-couchdb
  template:
    metadata:
      labels:
        app: obsidian-couchdb
        role: store
    spec:
      automountServiceAccountToken: false
      # ---------------------------------------------------------------------
      # Security boundary, stated explicitly because this image needs more
      # than a hardened workload normally gets.
      #
      # couchdb:3 runs as root on purpose: its entrypoint chowns /opt/couchdb,
      # writes the admin credentials into /opt/couchdb/etc/local.d/docker.ini,
      # and only then drops to the couchdb user with
      # `setpriv --reuid=couchdb --regid=couchdb --clear-groups`.
      #
      # Two consequences follow, both verified against the 3.5.2.1 entrypoint:
      #   - `runAsNonRoot` cannot be set; the chown and the docker.ini write
      #     only happen on the uid 0 path.
      #   - `drop: [ALL]` cannot be used as-is; setpriv needs SETUID and SETGID
      #     to drop privileges at all, and the chown needs CHOWN. Dropping
      #     everything would make the container fail rather than harden it.
      #
      # The five capabilities below are the exact set that path requires. The
      # process itself ends up running as the unprivileged couchdb user, so
      # this is a startup-time requirement, not a runtime privilege.
      # ---------------------------------------------------------------------
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 5984
        fsGroupChangePolicy: OnRootMismatch
      # ---------------------------------------------------------------------
      # Why the configuration is staged instead of mounted in place.
      #
      # The entrypoint runs
      #   find /opt/couchdb ! \( -user couchdb -group couchdb \) \
      #     -exec chown -f couchdb:couchdb '{}' +
      # under `set -e`. A ConfigMap or Secret mounted directly under
      # /opt/couchdb is read-only, so that chown fails; `-f` suppresses the
      # message, `set -e` then aborts, and the container exits 1 having
      # printed nothing at all. That is exactly what the first deployment did.
      #
      # Measured against couchdb:3 (3.5.2.1): with a read-only file in
      # local.d the container exits 1 silently; with the same configuration in
      # a writable directory CouchDB starts normally.
      #
      # So the ConfigMap and the Secret are copied into a writable emptyDir
      # that the entrypoint owns and can chown, and nothing read-only is left
      # under /opt/couchdb. The image's own local.d holds only a README, so
      # replacing the directory loses nothing.
      # ---------------------------------------------------------------------
      initContainers:
        - name: stage-config
          image: arm-cluster-master:5000/couchdb:3
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              cp /configmap/obsidian.ini /locald/obsidian.ini
              cp /secret/jwt_keys.ini /locald/jwt_keys.ini
              chmod 0644 /locald/obsidian.ini /locald/jwt_keys.ini
          volumeMounts:
            - name: locald
              mountPath: /locald
            - name: config
              mountPath: /configmap
              readOnly: true
            - name: jwt
              mountPath: /secret
              readOnly: true
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: couchdb
          image: arm-cluster-master:5000/couchdb:3
          imagePullPolicy: Always
          env:
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: obsidian-couchdb
                  key: COUCHDB_USER
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: obsidian-couchdb
                  key: COUCHDB_PASSWORD
          ports:
            - name: http
              containerPort: 5984
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETUID
                - SETGID
                - DAC_OVERRIDE
                - FOWNER
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            - name: locald
              mountPath: /opt/couchdb/etc/local.d
          # /_up is CouchDB's unauthenticated health endpoint. A probe against
          # / would return 401 once the admin account exists and would report
          # a healthy node as unhealthy.
          readinessProbe:
            httpGet:
              path: /_up
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: obsidian-couchdb
        - name: config
          configMap:
            name: obsidian-couchdb-config
        # The JWT verification key. It arrives as a Secret rather than sitting
        # in the ConfigMap so that no generated material is ever pasted into a
        # version-controlled file.
        - name: jwt
          secret:
            secretName: obsidian-couchdb
            items:
              - key: jwt_keys.ini
                path: jwt_keys.ini
        - name: locald
          emptyDir: {}
