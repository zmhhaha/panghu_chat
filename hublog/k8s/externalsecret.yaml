# 部署方式：先在 Vault 写入 secret/hublog/database 和 secret/hublog/redis，再 kubectl apply -f。
# 示例：vault kv put secret/hublog/database DATABASE_URL='postgresql+asyncpg://...'
#       vault kv put secret/hublog/redis REDIS_URL='redis://:...@redis.data.svc.cluster.local:6379/0'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hublog-config
  namespace: hublog
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hublog-config
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/data/hublog/database
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/data/hublog/redis
        property: REDIS_URL
