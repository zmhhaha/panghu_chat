apiVersion: v1
kind: ConfigMap
metadata:
  name: dsh-runtime
  namespace: dsh
data:
  TZ: Asia/Shanghai
  DSH_PUBLIC_HOST: dsh.panghuer.top
  # The Kubernetes project container IS the sandbox boundary, so DSH's inner
  # sandbox is not asked to be one. Under `workspace-write` DSH refuses to
  # execute anything when it cannot establish a backend, and on this cluster it
  # cannot: bubblewrap cannot mount procfs inside the container, and Landlock is
  # not compiled into any kernel in the fleet. The alternative is not a working
  # sandbox -- it is no execution at all. See docs/ssh-remote.md sections 10-11.
  #
  # Both the `sandbox-policy` and `approval` rows read this variable, so the
  # escalation prompts stop with it.
  DSH_PERMISSION_MODE: danger-full-access
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh-web
  namespace: dsh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dsh-web
  template:
    metadata:
      labels:
        app: dsh-web
        role: web
    spec:
      serviceAccountName: dsh-web
      automountServiceAccountToken: false
      # Single node with enough memory for the web plus its tooling.
      # Do not pin to the control plane and do not add memory-guard tolerations.
      # See docs/operations.md before changing this value.
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: orangepi5-max-server1
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 45
      containers:
      - name: dsh
        image: arm-cluster-master:5000/dsh-web:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 2Gi
            ephemeral-storage: 2Gi
        # Flags confirmed against the pinned package on 2026-09-18. `web` is an
        # alias of `--profile web`, and --trusted-host adds an authority the
        # /api browser-trust fence accepts -- required here because the loopback
        # adapter forwards the public Host rather than rewriting it.
        # Agent execution is redirected to the project container by the profile
        # composition in config/cordis.patch.yml, seeded into DSH_HOME at start.
        args:
        - web
        - --host
        - 127.0.0.1
        - --port
        - '3080'
        - --trusted-host
        - dsh.panghuer.top
        - --no-open
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: HOME
          value: /opt/data
        envFrom:
        - configMapRef:
            name: dsh-runtime
        # DSH_SSH_* -- the remote provider configuration. Generated by deploy.sh
        # because DSH_SSH_HELPER_HASH comes from the runner image build and must
        # not be committed.
        - configMapRef:
            name: dsh-ssh-runtime
        # Model provider credentials stay in this container only. Injected as
        # environment because the DSH config binds the key through apiKeyEnv
        # rather than reading a credential file.
        - secretRef:
            name: dsh-model
        volumeMounts:
        - name: home
          mountPath: /opt/data
        - name: tmp
          mountPath: /tmp
        # Exists ONLY so the workspace picker can offer it. The browse picker
        # lists the paths of the container it runs in -- the web pod -- while
        # the chosen workspace becomes the `cwd` of every remote spawn, so any
        # path a user picks here is one the project container must also have.
        # `/workspace` is the one path that means the right thing on both
        # sides: empty and unused here, the project volume there. Selecting
        # anything else (e.g. /opt/data/github) makes the remote spawn fail
        # with `spawn bash ENOENT`, which is Node reporting a missing cwd
        # rather than a missing executable. See docs/deployment-issues.md.
        - name: workspace
          mountPath: /workspace
        - name: owner
          mountPath: /owner
          readOnly: true
        # The transport private key and pinned host key. Copied out of this
        # read-only mount by auth/seed-profile.mjs, because ssh refuses a key
        # whose mode or owner it dislikes and a Secret volume's ownership is
        # set by the kubelet.
        - name: ssh-secret
          mountPath: /secrets/ssh
          readOnly: true
        # Matches the Include line in the image's /etc/ssh/ssh_config, so the
        # dsh-runner-* aliases apply to the ssh dsh-ssh spawns.
        - name: ssh-config
          mountPath: /etc/ssh/ssh_config.d
          readOnly: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          exec:
            command:
            - node
            - -e
            - "fetch('http://127.0.0.1:3081/_dsh_adapter/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1));"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - node
            - -e
            - "fetch('http://127.0.0.1:3081/_dsh_adapter/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1));"
          periodSeconds: 15
          timeoutSeconds: 5
      - name: oauth2-proxy
        image: arm-cluster-master:5000/oauth2-proxy:v7.8.0
        args:
        - --config=/oauth/oauth2-proxy.cfg
        envFrom:
        - secretRef:
            name: dsh-oidc
        ports:
        - name: http
          containerPort: 4180
        volumeMounts:
        - name: owner
          mountPath: /owner
          readOnly: true
        - name: oauth
          mountPath: /oauth
          readOnly: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          httpGet:
            path: /ping
            port: http
        livenessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 20
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: home
        persistentVolumeClaim:
          claimName: dsh-home
      - name: tmp
        emptyDir: {}
      # Empty on purpose -- see the mount comment above. This is a picker
      # affordance, not a copy of the project workspace.
      - name: workspace
        emptyDir: {}
      - name: owner
        configMap:
          name: dsh-owner
      - name: oauth
        configMap:
          name: dsh-oauth
      # The client half of the transport keypair. The host half lives in
      # dsh-runners and is never mounted here.
      - name: ssh-secret
        secret:
          secretName: dsh-ssh-client
          defaultMode: 288
      # Generated by deploy.sh from config/ssh_config.
      - name: ssh-config
        configMap:
          name: dsh-ssh-config
---
apiVersion: v1
kind: Service
metadata:
  name: dsh-web
  namespace: dsh
spec:
  selector:
    app: dsh-web
  ports:
  - port: 4180
    targetPort: http
