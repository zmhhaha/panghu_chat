# Project work container TEMPLATE -- not applied directly.
#
# panghu_chat/dsh/provision.sh renders this file with sed, replacing
# __PROJECT__, __NODE_HOSTNAME__ and __WORKSPACE_SIZE__, then applies the
# result. Do not kubectl apply this file as-is.
#
# One persistent container per project (change option B). Commands run here,
# never in the web container. The DSH web pod reaches it over SSH through
# dsh-runner-<project>; nothing here has cluster credentials.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsh-ws-__PROJECT__
  namespace: dsh-runners
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: __WORKSPACE_SIZE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh-runner-__PROJECT__
  namespace: dsh-runners
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dsh-runner-__PROJECT__
  template:
    metadata:
      labels:
        app: dsh-runner-__PROJECT__
        role: runner
        project: __PROJECT__
    spec:
      serviceAccountName: dsh-runner
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: __NODE_HOSTNAME__
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 45
      # Runs as root, and has to: sshd applies secure_filename() to the whole key
      # path and rejects any component that is group- or world-writable, while
      # Kubernetes creates every writable volume exactly that way (the emptyDir
      # at /state arrives as drwxrwsrwx, a secret volume as drwxrwsrwt). Only
      # root can chmod the volume root, so this happens before uid 10000 starts.
      # The container itself stays non-root and unprivileged.
      initContainers:
      - name: prepare-keys
        image: arm-cluster-master:5000/dsh-runner:latest
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - |
          set -eu
          chmod 0755 /state
          rm -rf /state/keys
          # Build as root, then hand the directory over. Doing it the other way
          # round fails: this container drops ALL capabilities and adds only
          # CHOWN, so root has no DAC_OVERRIDE and cannot enter a 0700
          # directory that already belongs to uid 10000.
          install -d -m 0700 /state/keys
          install -m 0600 /secrets/ssh/ssh_host_ed25519_key /state/keys/ssh_host_ed25519_key
          install -m 0600 /secrets/ssh/authorized_keys /state/keys/authorized_keys
          chown -R 10000:10000 /state/keys
          ls -la /state /state/keys
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          # CHOWN to hand the key directory to uid 10000, DAC_OVERRIDE to reach
          # inside it afterwards (and to clear it when the container restarts
          # within the same pod, since the emptyDir outlives a failed attempt).
          # Everything else stays dropped; nothing here touches the network.
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: ssh-secret
          mountPath: /secrets/ssh
          readOnly: true
        - name: state
          mountPath: /state
      containers:
      - name: runner
        image: arm-cluster-master:5000/dsh-runner:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 2Gi
            ephemeral-storage: 2Gi
        # sshd on 2222, non-root. dsh-ssh carries each program stream over a
        # forwarded Unix socket, which is why runner-ingress admits 2222 and
        # the Service port equals this container port.
        ports:
        - name: transport
          containerPort: 2222
        env:
        - name: TZ
          value: Asia/Shanghai
        # HOME and every tool cache live on the PVC so that installed
        # dependencies survive pod recreation.
        - name: HOME
          value: /workspace
        - name: XDG_CACHE_HOME
          value: /workspace/.cache
        - name: npm_config_cache
          value: /workspace/.cache/npm
        - name: PIP_CACHE_DIR
          value: /workspace/.cache/pip
        - name: GOCACHE
          value: /workspace/.cache/go-build
        - name: GOPATH
          value: /workspace/.local/go
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: ssh-secret
          mountPath: /secrets/ssh
          readOnly: true
        - name: state
          mountPath: /state
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
        securityContext:
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          # The runner image omits bubblewrap, so the official Linux provider
          # selects its ARM64 Landlock launcher. Landlock does not require user
          # namespaces or CAP_SYS_ADMIN.
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          tcpSocket:
            port: transport
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: transport
          periodSeconds: 30
          failureThreshold: 3
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: dsh-ws-__PROJECT__
      # The deployment-owned transport keys. The entrypoint copies them into
      # /state because sshd refuses a host key whose mode or owner it dislikes,
      # and a Secret volume's ownership is set by the kubelet, not by us.
      - name: ssh-secret
        secret:
          secretName: dsh-ssh-host
          defaultMode: 288
      # Holds the key directory the init container builds. Not persistent: the
      # host key comes from the Secret on every start, which is what keeps the
      # identity stable across restarts without leaving it in a writable layer.
      - name: state
        emptyDir: {}
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dsh-runner-__PROJECT__
  namespace: dsh-runners
spec:
  selector:
    app: dsh-runner-__PROJECT__
  ports:
  # Service port and container port are deliberately identical: NetworkPolicy
  # port matching happens before or after Service DNAT depending on the CNI,
  # and equal values make the rule correct either way.
  - name: transport
    port: 2222
    targetPort: transport
