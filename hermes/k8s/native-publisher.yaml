apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-publisher
  namespace: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-publisher
  template:
    metadata:
      labels:
        app: hermes-publisher
        role: publish
    spec:
      serviceAccountName: hermes
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: orangepi5-max-server1
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: publisher
        image: arm-cluster-master:5000/hermes-intelligence:latest
        imagePullPolicy: Always
        command: [/opt/hermes/.venv/bin/python, -m, app.native_publisher]
        envFrom:
        - configMapRef:
            name: hermes-runtime
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        ports:
        - name: http
          containerPort: 8090
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 128Mi
        volumeMounts:
        - name: home
          mountPath: /cron
          subPath: cron
          readOnly: true
        - name: reports
          mountPath: /reports
        - name: token
          mountPath: /credentials
          readOnly: true
      volumes:
      - name: home
        persistentVolumeClaim:
          claimName: hermes-web
          readOnly: true
      - name: reports
        persistentVolumeClaim:
          claimName: hermes-reports
      - name: token
        secret:
          secretName: hermes-hublog
          optional: true
          defaultMode: 288
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-publisher
  namespace: hermes
spec:
  selector:
    app: hermes-publisher
  ports:
  - port: 8090
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: native-publication-trigger
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      role: publish
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: hermes-web
    ports:
    - protocol: TCP
      port: 8090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: native-publication-client
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app: hermes-web
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: hermes-publisher
    ports:
    - protocol: TCP
      port: 8090
